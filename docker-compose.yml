services:
  postgres:
    image: postgres:17
    container_name: nex-postgres

    environment:
      POSTGRES_USER: nex
      POSTGRES_PASSWORD: nex
      POSTGRES_DB: nex

    ports:
      - "5432:5432"

    volumes:
      - nex_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  nex_postgres_data: